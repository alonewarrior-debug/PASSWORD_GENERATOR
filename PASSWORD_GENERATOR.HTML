<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Smart Password Generator</title>

    <link rel="stylesheet" href="PASSWORD_GENERATOR.CSS">
</head>

<body>

    <div class="background">
        <div class="cube cube1"></div>
        <div class="cube cube2"></div>
        <div class="cube cube3"></div>
    </div>

    <main class="container">

        <div class="password-card">

            <div class="card-header">
                <div class="lock">🔐</div>

                <h1>SMART<span>PASS</span></h1>

                <p>3D Memorable Password Generator</p>
            </div>


            <!-- Password Display -->
            <div class="password-box">

                <span id="password">
                    Click Generate
                </span>

                <button id="copyBtn" title="Copy Password">
                    📋
                </button>

            </div>


            <!-- Strength -->
            <div class="strength-section">

                <div class="strength-text">
                    <span>Security</span>
                    <span id="strengthText">READY</span>
                </div>

                <div class="strength-bar">
                    <div id="strengthBar"></div>
                </div>

            </div>


            <!-- Category -->
            <div class="control">

                <label>
                    PASSWORD CATEGORY
                </label>

                <select id="category">

                    <option value="random">
                        🎲 Random Category
                    </option>

                    <option value="names">
                        👤 Names
                    </option>

                    <option value="cars">
                        🚗 Car Brands
                    </option>

                    <option value="watches">
                        ⌚ Watch Brands
                    </option>

                    <option value="games">
                        🎮 Games
                    </option>

                    <option value="movies">
                        🎬 Movies
                    </option>

                    <option value="animals">
                        🐺 Animals
                    </option>

                    <option value="cities">
                        🌆 Cities
                    </option>

                </select>

            </div>


            <!-- Options -->
            <div class="options">

                <div class="option-card">

                    <label>
                        <input type="checkbox" id="numbers" checked>
                        <span class="custom-check"></span>

                        Add Numbers
                    </label>

                </div>


                <div class="option-card">

                    <label>
                        <input type="checkbox" id="symbols" checked>
                        <span class="custom-check"></span>

                        Add Symbol
                    </label>

                </div>

            </div>


            <!-- Number Length -->
            <div class="control">

                <label>
                    NUMBER LENGTH
                    <span id="numberValue">3</span>
                </label>

                <input
                    type="range"
                    id="numberLength"
                    min="1"
                    max="4"
                    value="3"
                >

            </div>


            <!-- Generate -->
            <button class="generate-btn" id="generateBtn">

                <span>⚡</span>

                GENERATE PASSWORD

            </button>


            <!-- Info -->
            <div class="info">

                <span>✓</span>

                <p>
                    Only ONE category is used in each password
                </p>

            </div>

        </div>

    </main>


    <script src="PASSWORD_GENERATOR.JS"></script>

</body>
</html>
